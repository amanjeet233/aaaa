<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Departments</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
  <div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h2>Employee MS</h2>
      <ul class="menu">
        <li><i class="fa fa-tachometer-alt"></i> Dashboard</li>
        <li><i class="fa fa-users"></i> Employee</li>
        <li class="active"><i class="fa fa-building"></i> Department</li>
        <li><i class="fa fa-calendar"></i> Leave</li>
        <li><i class="fa fa-user-check"></i> Attendance</li>
        <li><i class="fa fa-cog"></i> Settings</li>
      </ul>
    </aside>

    <!-- Main Section -->
    <main class="main-content">
      <header class="header">
        <span>Welcome Admin</span>
        <a href="#" class="logout" onclick="logout()">Logout</a>
      </header>

      <section class="manage-section">
        <div class="top-bar">
          <h3>Manage Departments</h3>
          <button class="add-btn"><i class="fa fa-plus"></i> Add New Department</button>
        </div>

        <table>
          <thead>
            <tr>
              <th>S.No</th>
              <th>Department Name</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td>1</td>
              <td>HR</td>
              <td>
                <button class="view">View</button>
                <button class="delete">Delete</button>
              </td>
            </tr>
            <tr>
              <td>2</td>
              <td>Logistics</td>
              <td>
                <button class="view">View</button>
                <button class="delete">Delete</button>
              </td>
            </tr>
            <tr>
              <td>3</td>
              <td>IT</td>
              <td>
                <button class="view">View</button>
                <button class="delete">Delete</button>
              </td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/department.js"></script>
</body>
</html>
