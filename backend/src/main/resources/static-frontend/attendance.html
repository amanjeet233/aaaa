<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Attendance</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script src="js/auth.js"></script>

<style>
    body {
        background: #f5f7fa;
        font-family: Arial, sans-serif;
    }
    .sidebar {
        width: 230px;
        height: 100vh;
        background: #12232E;
        color: #fff;
        position: fixed;
        left: 0;
        top: 0;
        padding-top: 20px;
    }
    .sidebar h4 {
        text-align: center;
        margin-bottom: 20px;
    }
    .sidebar a {
        color: #fff;
        padding: 12px 20px;
        display: block;
        text-decoration: none;
    }
    .sidebar a.active, .sidebar a:hover {
        background: #009688;
    }
    .content {
        margin-left: 240px;
        padding: 20px;
    }
    .card {
        border: none;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <h4>Employee MS</h4>
    <a href="dashboard.html">Dashboard</a>
    <a href="employee.html">Employee</a>
    <a href="department.html">Department</a>
    <a class="active" href="attendance.html">Attendance</a>
    <a href="leave.html">Leave</a>
    <a href="#">Settings</a>
</div>

<!-- Main Content -->
<div class="content">
    <div class="d-flex justify-content-between mb-4">
        <h4>Manage Attendance</h4>
        <div class="d-flex align-items-center">
            <strong class="me-2" id="currentDate">Mark Attendance for </strong>
            <button class="btn btn-success btn-sm" onclick="processAbsent()">Process Absent</button>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table mb-0">
                <thead class="table-light">
                    <tr>
                        <th>S.No</th>
                        <th>Name</th>
                        <th>Emp ID</th>
                        <th>Department</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="attendanceTableBody">
                    <!-- Table rows will be populated dynamically -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Add authentication check
    checkAuth();

    // Get current date
    const today = new Date();
    const dateString = today.toISOString().split('T')[0];
    document.getElementById('currentDate').textContent += dateString;

    // Function to load employees and their attendance
    async function loadAttendance() {
        try {
            const token = localStorage.getItem('token');
            const response = await fetch('/api/attendance/' + dateString, {
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });
            
            if (!response.ok) throw new Error('Failed to load attendance');
            
            const employees = await response.json();
            const tableBody = document.getElementById('attendanceTableBody');
            tableBody.innerHTML = '';

            employees.forEach((emp, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${emp.name}</td>
                    <td>${emp.employeeId}</td>
                    <td>${emp.department}</td>
                    <td>
                        <button class="btn btn-primary btn-sm" onclick="markAttendance('${emp.employeeId}', 'PRESENT')">Present</button>
                        <button class="btn btn-danger btn-sm" onclick="markAttendance('${emp.employeeId}', 'ABSENT')">Absent</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        } catch (error) {
            console.error('Error loading attendance:', error);
            alert('Failed to load attendance data');
        }
    }

    // Function to mark attendance
    async function markAttendance(employeeId, status) {
        try {
            const token = localStorage.getItem('token');
            const response = await fetch('/api/attendance/mark', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({
                    employeeId: employeeId,
                    date: dateString,
                    status: status
                })
            });

            if (!response.ok) throw new Error('Failed to mark attendance');

            // Reload attendance after marking
            loadAttendance();
        } catch (error) {
            console.error('Error marking attendance:', error);
            alert('Failed to mark attendance');
        }
    }

    // Function to process absent
    async function processAbsent() {
        try {
            const token = localStorage.getItem('token');
            const response = await fetch('/api/attendance/process-absent', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });

            if (!response.ok) throw new Error('Failed to process absent');

            alert('Successfully processed absent employees');
            loadAttendance();
        } catch (error) {
            console.error('Error processing absent:', error);
            alert('Failed to process absent employees');
        }
    }

    // Load attendance when page loads
    loadAttendance();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
