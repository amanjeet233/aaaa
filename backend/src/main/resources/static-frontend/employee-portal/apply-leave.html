    <label>Leave Type</label>
    <select id="leaveType"><option>Casual</option><option>Sick</option></select><br><br>
    <label>From Date</label>
    <input type="date" id="fromDate"> <br><br>
    <label>To Date</label>
    <input type="date" id="toDate"> <br><br>
    <label>Reason</label>
    <textarea id="reason" placeholder="Reason"></textarea><br><br>
    <button onclick="applyLeave()">Apply</button>
  </div>
</div>
